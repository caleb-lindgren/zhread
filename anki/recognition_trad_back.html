{{FrontSide}}
<div class=trad>
<hr id=answer>
<div class=word id=word></div>
<div class=py>{{Pinyin}}</div>
{{#DefZh}}<div class=def>{{DefZh}}</div>
{{#DefEn}}<details><summary>English</summary>
<div class=def>{{DefEn}}</div></details>{{/DefEn}}{{/DefZh}}
{{^DefZh}}<div class=def>{{DefEn}}</div>{{/DefZh}}
<script>
/* The word in traditional, and the simplified form after it in brackets
   when it differs, with the characters the two share as ～: 組合（组～）. */
(function () {
  var t = "{{text:Traditional}}", s = "{{text:Simplified}}", w = t || s;
  if (t && s && t != s) {
    var a = Array.from(t), b = Array.from(s);
    if (a.length == b.length) {
      b = b.map(function (c, i) { return c == a[i] ? "～" : c; });
    }
    w = t + "（" + b.join("") + "）";
  }
  document.getElementById("word").textContent = w;
})();
</script>
</div>
