{{#Cloze}}<div class="ctx simp" id=ctx>{{Cloze}}</div>
<div id=ctxs hidden>{{Contexts}}</div>
{{#DefZh}}<div class=def>{{DefZh}}</div>
{{#DefEn}}<details><summary>English</summary>
<div class=def>{{DefEn}}</div></details>{{/DefEn}}{{/DefZh}}
{{^DefZh}}<div class=def>{{DefEn}}</div>{{/DefZh}}
<script>
/* Blank the word wherever the definitions quote it: MoE examples often
   do, which would give the answer away. */
(function () {
  var forms = ["{{text:Simplified}}", "{{text:Traditional}}"];
  document.querySelectorAll(".def").forEach(function (e) {
    forms.forEach(function (w) {
      if (w) e.innerHTML = e.innerHTML.split(w).join("[…]");
    });
  });
})();
</script>
<script>
/* The definitions are in traditional, set in .card's Kai, but the English
   ones give a word in both scripts, CC-CEDICT as 組合|组合[zǔ hé] and
   Wiktionary as 組合／组合. Set the simplified half in the simplified
   font, rather than leave only the characters the Kai lacks to fall
   through to it one at a time. */
(function () {
  var re = /([\p{Script=Han}\w·]+)[|／]([\p{Script=Han}\w·]+)/gu;
  document.querySelectorAll(".def").forEach(function (d) {
    var w = document.createTreeWalker(d, NodeFilter.SHOW_TEXT), ns = [];
    while (w.nextNode()) ns.push(w.currentNode);
    ns.forEach(function (n) {
      var t = n.nodeValue, f = document.createDocumentFragment();
      var at = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(t))) {
        if (m[1] == m[2] || !/\p{Script=Han}/u.test(m[2])) continue;
        var end = m.index + m[0].length;
        f.append(t.slice(at, end - m[2].length));
        var s = document.createElement("span");
        s.className = "simp";
        s.textContent = m[2];
        f.append(s);
        at = end;
      }
      if (at) {
        f.append(t.slice(at));
        n.replaceWith(f);
      }
    });
  });
})();
</script>
<script>
/* Show the context and the word's others from the book in turn, a
   different one each time the card comes up: the front moves on to the
   next and stores which, and the back shows the one stored. Where the
   storage does not last between sessions, the turn starts at random. */
(function (back, cloze) {
  var key = "zhread:{{Card}}:{{text:Simplified}}:{{text:Traditional}}";
  var ctx = document.getElementById("ctx");
  var more = document.getElementById("ctxs");
  var all = [ctx.innerHTML].concat(Array.from(more.children,
    function (c) { return c.innerHTML; }));
  if (all.length < 2) return;
  var i = window[key];
  try {
    var s = localStorage.getItem(key);
    if (s != null) i = Number(s);
  } catch (e) {}
  if (back) {
    i = i == null ? 0 : i % all.length;
  } else {
    i = i == null ? Math.floor(Math.random() * all.length) :
      (i + 1) % all.length;
    window[key] = i;
    try { localStorage.setItem(key, i); } catch (e) {}
  }
  var h = all[i];
  if (cloze && i > 0) {
    /* As the cloze field does, blank the word and every other
       occurrence of it, with the blank the field has. */
    var blank = ctx.querySelector(".cloze").outerHTML;
    h = h.replace(/<b>[^<]*<\/b>/g, blank);
    ["{{text:Simplified}}", "{{text:Traditional}}"].forEach(function (w) {
      if (w) h = h.split(w).join(blank);
    });
  }
  ctx.innerHTML = h;
})(false, true);
</script>{{/Cloze}}
